<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺南市政府警察局歸仁分局交通勤務管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .tab-active { border-bottom: 3px solid #1d4ed8; color: #1d4ed8; font-weight: bold; }
    .subnav-active { background-color: #1e40af; color: #ffffff; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導航列 Header -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-shield-halved text-2xl text-blue-400"></i>
        <h1 id="sysTitle" class="text-xl font-bold tracking-wide">臺南市政府警察局歸仁分局交通勤務管理系統</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
          <i class="fa-solid fa-user text-slate-400 mr-1"></i> <span id="currentUserDisplay">管理員 (admin)</span>
        </span>
        <button onclick="resetToDefaultData()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-2.5 py-1.5 rounded transition">
          <i class="fa-solid fa-rotate-left mr-1"></i> 強制重置最新資料
        </button>
      </div>
    </div>
  </header>

  <!-- 主要分頁頁籤 Top Tabs -->
  <nav class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 flex space-x-8">
      <button id="topTabSpeedBtn" onclick="switchTopTab('speed')" class="py-3 px-2 tab-active transition">
        <i class="fa-solid fa-gauge-high mr-1"></i> <span id="label_topTabSpeed">測速勤務</span>
      </button>
      <button id="topTabTrafficBtn" onclick="switchTopTab('traffic')" class="py-3 px-2 text-slate-500 hover:text-slate-700 transition">
        <i class="fa-solid fa-road mr-1"></i> <span id="label_topTabTraffic">道路交通工程</span>
      </button>
      <button id="topTabAdminBtn" onclick="switchTopTab('admin')" class="py-3 px-2 text-slate-500 hover:text-slate-700 transition">
        <i class="fa-solid fa-gears mr-1"></i> <span id="label_topTabAdmin">系統總後台設定</span>
      </button>
    </div>
  </nav>

  <!-- 測速勤務 次級功能導航 SubNav -->
  <div id="speedSubNav" class="bg-slate-800 text-slate-300">
    <div class="max-w-7xl mx-auto px-4 flex space-x-2 overflow-x-auto py-2 text-sm">
      <button id="snav_home_btn" onclick="switchSubTab('home')" class="px-3 py-1.5 rounded subnav-active transition">
        <i class="fa-solid fa-table-list mr-1"></i> <span id="label_snav_home">測速勤務一覽表</span>
      </button>
      <button id="snav_station_btn" onclick="switchSubTab('station')" class="px-3 py-1.5 rounded hover:bg-slate-700 transition">
        <i class="fa-solid fa-pen-to-square mr-1"></i> <span id="label_snav_station">各所勤務填報</span>
      </button>
      <button id="snav_case_btn" onclick="switchSubTab('case')" class="px-3 py-1.5 rounded hover:bg-slate-700 transition">
        <i class="fa-solid fa-folder-open mr-1"></i> <span id="label_snav_case">測速案件管制表</span>
      </button>
      <button id="snav_41_btn" onclick="switchSubTab('41')" class="px-3 py-1.5 rounded hover:bg-slate-700 transition">
        <i class="fa-solid fa-location-dot mr-1"></i> <span id="label_snav_41">4.1 地點與儀器核定</span>
      </button>
      <button id="snav_42_btn" onclick="switchSubTab('42')" class="px-3 py-1.5 rounded hover:bg-slate-700 transition">
        <i class="fa-solid fa-boxes-packing mr-1"></i> <span id="label_snav_42">4.2 測速儀保管與履歷</span>
      </button>
      <button id="snav_43_btn" onclick="switchSubTab('43')" class="px-3 py-1.5 rounded hover:bg-slate-700 transition">
        <i class="fa-solid fa-file-pdf mr-1"></i> <span id="label_snav_43">4.3 檢定證書(PDF)</span>
      </button>
    </div>
  </div>

  <!-- 主要內容顯示區 Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">

    <!-- 1. 測速勤務一覽表 Section -->
    <section id="section_home" class="space-y-4">
      <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 id="label_card_homeTable" class="text-lg font-bold text-slate-800 border-l-4 border-blue-600 pl-3">
            當月全分局測速勤務總表彙整
          </h2>
          <span class="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-semibold">2026年8月份</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
              <tr>
                <th class="border p-2.5">日期</th>
                <th class="border p-2.5">單位</th>
                <th class="border p-2.5">時間</th>
                <th class="border p-2.5">地點</th>
                <th class="border p-2.5">儀器</th>
                <th class="border p-2.5">執勤人員</th>
                <th class="border p-2.5">狀態</th>
              </tr>
            </thead>
            <tbody id="dutyTableBody">
              <!-- JavaScript 動態帶入資料 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 2. 4.2 測速儀保管與履歷 Section -->
    <section id="section_42" class="space-y-4 hidden">
      <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <h2 id="label_snav_42_title" class="text-lg font-bold text-slate-800 border-l-4 border-blue-600 pl-3 mb-4">
          4.2 測速儀器保管與對照履歷
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="bg-slate-100 text-slate-700 font-semibold">
              <tr>
                <th class="border p-2.5">設備代碼</th>
                <th class="border p-2.5">設備名稱/序號</th>
                <th class="border p-2.5">當前保管人</th>
                <th class="border p-2.5">職稱</th>
                <th class="border p-2.5">保管單位</th>
                <th class="border p-2.5">保管期限</th>
              </tr>
            </thead>
            <tbody id="keeperTableBody">
              <!-- JavaScript 動態帶入保管人資料 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 3. 通用備用頁面 Section (其他分頁預設樣板) -->
    <section id="section_generic" class="hidden">
      <div class="bg-white p-8 rounded-lg shadow-sm border border-slate-200 text-center py-12">
        <i class="fa-solid fa-circle-info text-4xl text-blue-500 mb-3"></i>
        <h3 id="genericTitle" class="text-xl font-bold text-slate-700">頁面載入成功</h3>
        <p class="text-slate-500 text-sm mt-2">相關資料與組態已成功同步載入至最新狀態。</p>
      </div>
    </section>

  </main>

  <footer class="bg-slate-200 border-t border-slate-300 py-4 text-center text-xs text-slate-600">
    臺南市政府警察局歸仁分局 版權所有 &copy; 2026 Traffic Management System
  </footer>

  <!-- 系統核心資料與控制邏輯 Script -->
  <script>
    // 預設最新系統 JSON 資料 (包含全域名稱、勤務、裝備保管人等)
    const DEFAULT_SYSTEM_DATA = {
      "adminUsername": "admin",
      "caseRecords": {
        "LASER-1": [
          { "date": "2026-08-01", "isEntry": "是", "officer": "方士翔" },
          null, null,
          { "date": "2026-08-04", "isEntry": "是", "officer": "陳慶徽" },
          null,
          { "date": "2026-08-06", "isEntry": "是", "officer": "王英鑫" }
        ]
      },
      "customTitles": {
        "brandCombined": "臺南市政府警察局歸仁分局交通勤務管理系統",
        "card_caseEquip": "測速裝備選擇與登錄",
        "card_caseList": "案件登記列表",
        "card_homeTable": "當月全分局測速勤務總表彙整",
        "card_stationDuty": "各所勤務選填管理",
        "snav_41": "4.1 地點與儀器核定",
        "snav_42": "4.2 測速儀保管與履歷",
        "snav_43": "4.3 檢定證書(PDF)",
        "snav_44": "4.4 人員嘉獎統計",
        "snav_45": "4.5 時段地點統計",
        "snav_case": "測速案件管制表",
        "snav_home": "測速勤務一覽表",
        "snav_station": "各所勤務填報",
        "topTabAdmin": "系統總後台設定",
        "topTabSpeed": "測速勤務",
        "topTabTraffic": "道路交通工程"
      },
      "dutyRecords": [
        { "id": 1, "date": "2026-08-01", "station": "仁德分駐所", "time": "08:00-10:00", "location": "市道182線10K", "equipment": "LASER-3", "officer": "王英鑫", "status": "正常執行" },
        { "id": 2, "date": "2026-08-02", "station": "文賢派出所", "time": "14:00-16:00", "location": "台1線340K", "equipment": "LASER-4", "officer": "張雯倩", "status": "正常執行" },
        { "id": 3, "date": "2026-08-03", "station": "歸仁派出所", "time": "10:00-12:00", "location": "台39線12K", "equipment": "LASER-5", "officer": "楊丁樺", "status": "正常執行" },
        { "id": 4, "date": "2026-08-04", "station": "關廟分駐所", "time": "16:00-18:00", "location": "市道182線18K", "equipment": "LASER-6", "officer": "陳韋霖", "status": "正常執行" }
      ],
      "equipKeepers": {
        "LASER-1": { "name": "馮奎禎", "title": "巡佐", "unit": "分局交通組", "period": "2026-01-01 ～ 2026-12-31", "sn": "TC007871" },
        "LASER-2": { "name": "馮奎禎", "title": "巡佐", "unit": "分局交通組", "period": "2026-01-01 ～ 2026-12-31", "sn": "TC010767" },
        "LASER-3": { "name": "王英鑫", "title": "警員", "unit": "仁德分駐所", "period": "2026-01-01 ～ 2026-12-31", "sn": "TC007876" },
        "LASER-4": { "name": "張雯倩", "title": "警員", "unit": "文賢派出所", "period": "2026-01-01 ～ 2026-12-31", "sn": "TC013416" },
        "LASER-5": { "name": "楊丁樺", "title": "警員", "unit": "歸仁派出所", "period": "2026-01-01 ～ 2026-12-31", "sn": "TC011978" },
        "LASER-6": { "name": "陳韋霖", "title": "警員", "unit": "關廟分駐所", "period": "2026-01-01 ～ 2026-12-31", "sn": "TC013417" },
        "RADAR-1": { "name": "馮奎禎", "title": "巡佐", "unit": "分局交通組", "period": "2026-01-01 ～ 2026-12-31", "sn": "22M009" },
        "RADAR-2": { "name": "張雯倩", "title": "警員", "unit": "文賢派出所", "period": "2026-01-01 ～ 2026-12-31", "sn": "24M066" }
      }
    };

    // 初始化 App 資料
    let appData = {};

    function initSystem() {
      // 讀取 LocalStorage 或載入預設
      const saved = localStorage.getItem('speed_system_data');
      if (saved) {
        try {
          appData = JSON.parse(saved);
        } catch (e) {
          appData = DEFAULT_SYSTEM_DATA;
        }
      } else {
        appData = DEFAULT_SYSTEM_DATA;
        localStorage.setItem('speed_system_data', JSON.stringify(appData));
      }

      applyCustomTitles();
      renderDutyTable();
      renderKeeperTable();
    }

    // 更新標題文字
    function applyCustomTitles() {
      if (!appData.customTitles) return;
      const t = appData.customTitles;
      if (t.brandCombined) document.getElementById('sysTitle').innerText = t.brandCombined;
      if (t.topTabSpeed) document.getElementById('label_topTabSpeed').innerText = t.topTabSpeed;
      if (t.topTabTraffic) document.getElementById('label_topTabTraffic').innerText = t.topTabTraffic;
      if (t.topTabAdmin) document.getElementById('label_topTabAdmin').innerText = t.topTabAdmin;
      if (t.snav_home) document.getElementById('label_snav_home').innerText = t.snav_home;
      if (t.snav_station) document.getElementById('label_snav_station').innerText = t.snav_station;
      if (t.snav_case) document.getElementById('label_snav_case').innerText = t.snav_case;
      if (t.snav_41) document.getElementById('label_snav_41').innerText = t.snav_41;
      if (t.snav_42) document.getElementById('label_snav_42').innerText = t.snav_42;
      if (t.snav_43) document.getElementById('label_snav_43').innerText = t.snav_43;
      if (t.card_homeTable) document.getElementById('label_card_homeTable').innerText = t.card_homeTable;
    }

    // 渲染勤務紀錄表
    function renderDutyTable() {
      const tbody = document.getElementById('dutyTableBody');
      tbody.innerHTML = '';
      if (!appData.dutyRecords) return;

      appData.dutyRecords.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 border-b";
        tr.innerHTML = `
          <td class="p-2.5 font-medium">${r.date}</td>
          <td class="p-2.5">${r.station}</td>
          <td class="p-2.5">${r.time}</td>
          <td class="p-2.5">${r.location}</td>
          <td class="p-2.5"><span class="bg-slate-100 text-slate-800 px-2 py-0.5 rounded text-xs border">${r.equipment}</span></td>
          <td class="p-2.5">${r.officer}</td>
          <td class="p-2.5"><span class="text-green-600 font-semibold text-xs bg-green-50 px-2 py-1 rounded border border-green-200">${r.status}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 渲染 4.2 裝備保管人表
    function renderKeeperTable() {
      const tbody = document.getElementById('keeperTableBody');
      tbody.innerHTML = '';
      if (!appData.equipKeepers) return;

      Object.keys(appData.equipKeepers).forEach(code => {
        const k = appData.equipKeepers[code];
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 border-b";
        tr.innerHTML = `
          <td class="p-2.5 font-bold text-blue-700">${code}</td>
          <td class="p-2.5">${k.sn}</td>
          <td class="p-2.5 font-medium">${k.name}</td>
          <td class="p-2.5">${k.title}</td>
          <td class="p-2.5">${k.unit}</td>
          <td class="p-2.5 text-xs text-slate-500">${k.period}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 切換 SubNav 頁面
    function switchSubTab(tabKey) {
      document.querySelectorAll('#speedSubNav button').forEach(btn => {
        btn.classList.remove('subnav-active');
        btn.classList.add('hover:bg-slate-700');
      });
      document.getElementById(`snav_${tabKey}_btn`).classList.add('subnav-active');

      // 隱藏所有區塊
      document.getElementById('section_home').classList.add('hidden');
      document.getElementById('section_42').classList.add('hidden');
      document.getElementById('section_generic').classList.add('hidden');

      if (tabKey === 'home') {
        document.getElementById('section_home').classList.remove('hidden');
      } else if (tabKey === '42') {
        document.getElementById('section_42').classList.remove('hidden');
      } else {
        document.getElementById('section_generic').classList.remove('hidden');
        document.getElementById('genericTitle').innerText = `已切換至【${document.getElementById(`label_snav_${tabKey}`)?.innerText || tabKey}】`;
      }
    }

    function switchTopTab(tabKey) {
      document.getElementById('genericTitle').innerText = `已切換至【${tabKey.toUpperCase()}】主分頁`;
      document.getElementById('section_home').classList.add('hidden');
      document.getElementById('section_42').classList.add('hidden');
      document.getElementById('section_generic').classList.remove('hidden');
    }

    // 強制重置最新預設資料
    function resetToDefaultData() {
      if (confirm('確定要將系統資料重置為您剛剛上傳的最新 JSON 備份檔嗎？')) {
        localStorage.setItem('speed_system_data', JSON.stringify(DEFAULT_SYSTEM_DATA));
        appData = DEFAULT_SYSTEM_DATA;
        initSystem();
        alert('資料已順利重置恢復！');
      }
    }

    // 啟動系統
    window.onload = initSystem;
  </script>
</body>
</html>
